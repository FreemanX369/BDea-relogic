name: Bootstrap BlackDragon T17.27

on:
  push:
    branches: [ import/t1727-latest-20260908 ]
    paths:
      - '.transport/t1727/**'
      - '.github/workflows/bootstrap-t1727.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize-source:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reconstruct and attest T17.27 patch
        shell: bash
        run: |
          set -euo pipefail
          cat .transport/t1727/runtime.patch.gz.b64.part-* > /tmp/runtime.patch.gz.b64
          base64 -d /tmp/runtime.patch.gz.b64 > /tmp/runtime.patch.gz
          echo '7fdd42765b673412d723a2dbe6daf3745e17b65e35dfff6ee7eb4ace28b74efa  /tmp/runtime.patch.gz' | sha256sum -c -
          gzip -dc /tmp/runtime.patch.gz > /tmp/runtime.patch
          echo 'b1ff52ff39bb84f9454b183177d09276c2702845798e699e58618bbd636c5f65  /tmp/runtime.patch' | sha256sum -c -
      - name: Import verified T17.26 incident baseline
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/bd-baseline
          git clone --depth 1 --branch import/t1726-incident-fix-20260908 https://github.com/FreemanX369/BlackDragon-rebuild.git /tmp/bd-baseline
          test "$(git -C /tmp/bd-baseline rev-parse HEAD)" = 'd3d7215bc0f01dc672ba166c343cf81a033b4254'
          rm -rf BlackDragon_v14
          cp -a /tmp/bd-baseline/BlackDragon_v14 ./BlackDragon_v14
      - name: Forward-port T17.27 production delta
        shell: bash
        run: |
          set -euo pipefail
          git apply --check /tmp/runtime.patch
          git apply /tmp/runtime.patch
          grep -Fq '#property version   "15.04"' BlackDragon_v14/Experts/BlackDragon/BlackDragon.mq5
          test -f BlackDragon_v14/Include/BlackDragon/LifecycleT1727.mqh
          test -f BlackDragon_v14/Include/BlackDragon/LegacyJournalT1727.mqh
          test -f BlackDragon_v14/Include/BlackDragon/ConfigDiagnosticsT1727.mqh
      - name: Preserve incident fix and apply native compatibility fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          cfg=Path('BlackDragon_v14/Include/BlackDragon/Recovery/RecoveryT16ConfigT177C5Impl.mqh')
          s=cfg.read_text(encoding='utf-8')
          pat=r'''bool Recovery_T177CanAcceptLegacyPersistenceC5\(\)\s*\{\s*#if BD_UNIT_POLICY_REV >= 2.*?#else\s*return Recovery_T177MigrationSelectorsLegacyPure\(OverlapPolicy_,\s*HedgeTargetCoveragePercent_,\s*HedgeAbsoluteMaxCoveragePercent_,\s*EnableGlobalHedgeSL_,\s*GlobalSLAfterGenerations_\);\s*#endif\s*\}'''
          repl='''bool Recovery_T177CanAcceptLegacyPersistenceC5()\n{\n   // T17.27 native MQL5 compatibility: policy rev is 2, so legacy persistence\n   // cannot bypass the effective unit-profile fingerprint.\n   return false;\n}'''
          s2,n=re.subn(pat,repl,s,flags=re.S)
          if n != 1: raise SystemExit(f'expected one native preprocessor replacement, got {n}')
          cfg.write_text(s2,encoding='utf-8',newline='\n')

          news=Path('BlackDragon_v14/Include/BlackDragon/NewsCalendar.mqh')
          s=news.read_text(encoding='utf-8')
          reps={
            'm_windows[n].from=time-(long)beforeMin*60;':'m_windows[n].from=(datetime)(time-(long)beforeMin*60);',
            'm_windows[n].to=time+(long)afterMin*60;':'m_windows[n].to=(datetime)(time+(long)afterMin*60);',
            'datetime from=now>back?now-back:0,to=now+ahead;':'datetime from=(datetime)(now>back?now-back:0),to=(datetime)(now+ahead);',
          }
          for a,b in reps.items():
              if s.count(a)!=1: raise SystemExit(f'expected exactly one NewsCalendar site: {a}')
              s=s.replace(a,b)
          news.write_text(s,encoding='utf-8',newline='\n')
          PY
          grep -Fq 'HistorySelect(0, TimeCurrent()+1)' BlackDragon_v14/Include/BlackDragon/Recovery/RecoveryArcsStackHardened.mqh
          grep -Fq 'PROTECTIVE_MISMATCH' BlackDragon_v14/Include/BlackDragon/Recovery/RecoveryArcsStackHardened.mqh
          ! grep -Fq '#if BD_UNIT_POLICY_REV >= 2' BlackDragon_v14/Include/BlackDragon/Recovery/RecoveryT16ConfigT177C5Impl.mqh
      - name: Write composite handover and commit source
        shell: bash
        run: |
          set -euo pipefail
          cat > START_HERE.md <<'EOF'
          # BlackDragon v15.04 / T17.27 — GitHub composite build

          Build entry: `BlackDragon_v14/Experts/BlackDragon/BlackDragon.mq5`.

          This branch materializes the latest T17.27 production delta on top of the verified T17.26 incident-fix baseline, preserving the demonstrated `TimeCurrent()+1` protective-history horizon and bounded `PROTECTIVE_MISMATCH` diagnostics. It also carries the native MetaEditor compatibility edits required for zero-warning compilation: the T17.27 unit-policy legacy selector is unconditional fail-closed at revision 2, and NewsCalendar long-to-datetime conversions are explicit.

          Transport is SHA-256-attested before apply. Native Windows compilation is a separate workflow and is the release gate before merge.
          EOF
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add BlackDragon_v14 START_HERE.md
          if git diff --cached --quiet; then
            echo 'Source already materialized; nothing to commit.'
            exit 0
          fi
          git commit -m 'feat: materialize BlackDragon v15.04 T17.27 source'
          git push origin HEAD:import/t1727-latest-20260908
